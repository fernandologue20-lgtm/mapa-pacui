<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa da Farinha do Pacuí</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; text-align: center; }
        #map { height: 600px; width: 100%; margin-top: 20px; border: 2px solid #333; }
    </style>
</head>
<body>

    <h1>Região do Pacuí: Comunidades Produtoras</h1>
    <p>Mapa georreferenciado da dissertação de Mestrado PROFNIT/UNIFAP.</p>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inicializar o mapa
        var map = L.map('map').setView([0.75, -50.8], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 2. Carregar o arquivo GeoJSON (certifique-se de que o nome no seu repositório seja pacui.geojson)
        fetch('pacui.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, { style: { color: 'green', weight: 3, fillOpacity: 0.2 } }).addTo(map);
            })
            .catch(err => console.error("Erro ao carregar o GeoJSON:", err));

        // 3. Carregar os dados das comunidades via Apps Script
        // SUBSTITUA O LINK ABAIXO PELO SEU LINK DO WEB APP (/exec)
        var urlAPI = 'https://script.google.com/macros/s/AKfycbzxD5RjltttToGyUfR7SyrFSjAMHm7RIXCfn8N328MDiD7BtVCPxhvYpxyae8okQVWvTw/exec';

        fetch(urlAPI)
            .then(res => res.json())
            .then(comunidades => {
                comunidades.forEach(c => {
                    var marker = L.marker([c.lat, c.lng]).addTo(map);
                    marker.bindPopup(`
                        <b>${c.nome}</b><br>
                        Tipo: ${c.tipoFarinha}<br>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}" target="_blank">
                            Como chegar (GPS)
                        </a>
                    `);
                });
            })
            .catch(err => console.error("Erro ao carregar dados da planilha:", err));
    </script>
</body>
</html>

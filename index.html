<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style> 
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        #mapa { height: 100vh; width: 100vw; }
        .label-estilo { background: transparent; border: none; box-shadow: none; font-size: 11px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
    <div id="mapa"></div>
    <script>
        var mapa = L.map('mapa').setView([0.8, -50.7], 9); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
        
        // Carrega os dados das comunidades
        fetch("https://script.google.com/macros/s/AKfycbzxD5RjltttToGyUfR7SyrFSjAMHm7RIXCfn8N328MDiD7BtVCPxhvYpxyae8okQVWvTw/exec")
            .then(res => res.json())
            .then(dados => {
                dados.forEach(c => {
                    var lat = parseFloat(c.lat);
                    var lng = parseFloat(c.lng);
                    if (!isNaN(lat) && !isNaN(lng)) {
                        L.marker([lat, lng]).addTo(mapa).bindPopup("<b>" + c.nome + "</b>").bindTooltip(c.nome, { permanent: true, direction: 'top', className: 'label-estilo', offset: [0, -10] });
                    }
                });
            });

        // Carrega o polígono do arquivo separado
        fetch('pacui.json')
            .then(res => res.json())
            .then(data => {
                L.polygon(data.geometry.coordinates.map(c => [c[1], c[0]]), {
                    color: "#ff0000", weight: 2, fillOpacity: 0.15
                }).addTo(mapa);
            });
    </script>
</body>
</html>

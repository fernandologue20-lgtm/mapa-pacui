<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style> #mapa { height: 600px; } </style>
</head>
<body>
    <div id="mapa"></div>
    <script>
        // Cria o mapa
        var mapa = L.map('mapa').setView([0.8, -50.7], 9); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
        
        var link = "https://script.google.com/macros/s/AKfycbzxD5RjltttToGyUfR7SyrFSjAMHm7RIXCfn8N328MDiD7BtVCPxhvYpxyae8okQVWvTw/exec"; 

        fetch(link)
            .then(res => res.json())
            .then(dados => {
                console.log("Dados carregados:", dados); // Veja no Console (F12) se os dados chegaram
                
                dados.forEach(c => {
                    // Verifica se o lat e lng são números válidos
                    var lat = parseFloat(c.lat);
                    var lng = parseFloat(c.lng);
                    
                    if (!isNaN(lat) && !isNaN(lng)) {
                        L.marker([lat, lng]).addTo(mapa)
                         .bindPopup("<b>" + c.nome + "</b><br>Farinha: " + c.tipoFarinha);
                    }
                });
            });
        // 1. O polígono que você desenhou
var geojsonPacui = {
  "type": "Feature",
  "geometry": {
    "type": "Polygon",
    "coordinates": [ [

        [-50.4446678, 0.666728, 0],
        [-50.39219600000001, 0.7138748, 0],
        [-50.34629580000001, 0.7311321999999999, 0],
        [-50.34615280000001, 0.7389283, 0],
        [-50.31677460000001, 0.7582812999999999, 0],
        [-50.2867296, 0.7584554999999998, 0],
        [-50.2717942, 0.7494761, 0],
        [-50.2858427, 0.8726370999999999, 0],
        [-50.286888, 0.8937786, 0],

        [-50.84209299999999, 0.7915582, 0]
    ] ]
  }
};

// 2. Adicionando ao mapa com o estilo que você definiu no GeoJSON
L.geoJSON(geojsonPacui, {
    style: {
        color: "#ff0000",       // Vermelho (como definido no seu JSON)
        weight: 4,              // Espessura da linha
        fillOpacity: 0.25       // Transparência
    }
}).addTo(mapa);
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style> 
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        #mapa { height: 100vh; width: 100vw; }
        .label-estilo {
            background: transparent;
            border: none;
            box-shadow: none;
            font-size: 11px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div id="mapa"></div>
    <script>
        var mapa = L.map('mapa').setView([0.8, -50.7], 9); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
        
        var link = "https://script.google.com/macros/s/AKfycbzxD5RjltttToGyUfR7SyrFSjAMHm7RIXCfn8N328MDiD7BtVCPxhvYpxyae8okQVWvTw/exec"; 

        fetch(link)
            .then(res => res.json())
            .then(dados => {
                dados.forEach(c => {
                    var lat = parseFloat(c.lat);
                    var lng = parseFloat(c.lng);
                    
                    if (!isNaN(lat) && !isNaN(lng)) {
                        var marcador = L.marker([lat, lng]).addTo(mapa)
                            .bindPopup("<b>" + c.nome + "</b><br>Farinha: " + c.tipoFarinha);
                        
                        marcador.bindTooltip(c.nome, {
                            permanent: true,
                            direction: 'top',
                            className: 'label-estilo',
                            offset: [0, -10]
                        });
                    }
                });
            });

        // Polígono atualizado
        var geojsonPacui = {
            "type": "Feature",
            "geometry": {
                "type": "Polygon",
                "coordinates": [ [
                    [-50.851278, 0.8081065],
                    [-50.5534, 0.9196998],
                    [-50.4913093, 0.9417037],
                    [-50.4237169, 0.9652792],
                    [-50.347479, 0.9668509],
                    [-50.2893181, 0.9637075],
                    [-50.2696692, 0.8536872],
                    [-50.2570938, 0.7444497],
                    [-50.4724463, 0.6493559],
                    [-50.6485009, 0.5911984],
                    [-50.701946, 0.5825533],
                    [-50.8347729, 0.7248024],
                    [-50.851278, 0.8081065]
                ] ]
            }
        };

        L.geoJSON(geojsonPacui, {
            style: { color: "#ff0000", weight: 3, fillOpacity: 0.15 }
        }).addTo(mapa);
    </script>
</body>
</html>

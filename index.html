        L.control.layers(baseMaps, overlayMaps).addTo(mapa);

        // 3. Carregar Comunidades da Planilha
        var markers = L.markerClusterGroup();

        fetch(urlPlanilha)
            .then(res => res.json())
            .then(dados => {
                dados.forEach(c => {
                    var lat = parseFloat(c.lat);
                    var lng = parseFloat(c.lng);
                    if (!isNaN(lat) && !isNaN(lng)) {
                        L.circleMarker([lat, lng], {radius: 5, fillColor: "#2e7d32", color: "#fff", weight: 1, fillOpacity: 0.9})

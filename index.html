<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Gestão de IGs - Amapá</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f9f9f9; user-select: none; }
        
        .menu-nav { background-color: #2e7d32; padding: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .menu-nav button { background: #fff; border: 2px solid #ff9800; color: #2e7d32; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; transition: 0.3s; }
        .menu-nav button:hover { background: #ff9800; color: white; border-color: white; }
        
        .secao { display: none; padding: 20px; max-width: 1000px; margin: auto; }
        #container-mapa { display: flex; height: 500px; border: 2px solid #ddd; border-radius: 8px; overflow: hidden; }
        
        #mapa-container { flex: 3; height: 100%; }
        #lista-comunidades { flex: 1; overflow-y: auto; background: #fff; border-left: 2px solid #ddd; }
        
        .item-comunidade { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.9em; transition: 0.2s; }
        .item-comunidade:hover { background: #f0f0f0; }
        
        .coords { font-size: 0.75em; color: #666; display: none; margin-top: 4px; font-style: italic; }
        .item-comunidade:hover .coords { display: block; }
        
        .texto-pacui div { font-size: 20px; font-weight: 900; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; text-shadow: 2px 2px 4px #000; pointer-events: none; }
    </style>
</head>
<body>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) return false;
        };
    </script>

    <nav class="menu-nav">
        <button onclick="mostrar('mapa')">Mapa Interativo</button>
        <button onclick="mostrar('inpi')">Exigências INPI</button>
        <button onclick="mostrar('amapa')">IGs do Amapá</button>
        <button onclick="mostrar('biblioteca')">Biblioteca</button>
    </nav>

    <div id="mapa" class="secao" style="display:block;">
        <div id="container-mapa">
            <div id="mapa-container"></div>
            <div id="lista-comunidades">
                <h4 style="padding:10px; background:#f4f4f4; margin:0;">Comunidades</h4>
                <div id="lista-itens"></div>
            </div>
        </div>
    </div>

    <div id="inpi" class="secao">
        <h2>Exigências do INPI</h2>
        <p>Conteúdo sobre Dossiê, CET e Governança.</p>
    </div>

    <div id="amapa" class="secao">
        <h2>IGs do Amapá</h2>
        <p>Informações sobre o Abacaxi de Porto Grande e Açaí do Bailique.</p>
    </div>

    <div id="biblioteca" class="secao">
        <h2>Biblioteca Acadêmica</h2>
        <p>Pesquisas sobre o Pacuí.</p>
    </div>

    <script>
        var mapa = L.map('mapa-container').setView([0.75, -50.7], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

        function mostrar(id) {
            document.querySelectorAll('.secao').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if(id === 'mapa') { mapa.invalidateSize(); mapa.setView([0.75, -50.7], 10); }
        }

        var urlPlanilha = "https://script.google.com/macros/s/AKfycbygrHOhYywIbHq_-8wULBkykeTmP8U01KzfdFwij4zxNozs_gajxnwEnadhz_OuPBtNdg/exec"; 
        
        fetch(urlPlanilha)
            .then(res => res.json())
            .then(dados => {
                if (dados.poligono) {
                    var poly = L.polygon(dados.poligono.map(p => [p.lat, p.lng]), {color: "#b71c1c", weight: 3, fillColor: "#f44336", fillOpacity: 0.3}).addTo(mapa);
                    L.marker(poly.getBounds().getCenter(), {
                        icon: L.divIcon({className: 'texto-pacui', html: '<div>REGIÃO DO PACUÍ</div>', iconSize: [250, 40]})
                    }).addTo(mapa);
                }

                var listaDiv = document.getElementById('lista-itens');
                dados.comunidades.forEach(c => {
                    var marker = L.circleMarker([c.lat, c.lng], {radius: 6, fillColor: "#2e7d32", color: "#fff", weight: 2}).bindPopup(`<strong>${c.nome}</strong>`).addTo(mapa);
                    
                    var div = document.createElement('div');
                    div.className = 'item-comunidade';
                    div.innerHTML = `📍 <strong>${c.nome}</strong><br><span class="coords">Lat: ${c.lat}, Lng: ${c.lng}</span>`;
                    div.onclick = function() { mapa.setView([c.lat, c.lng], 14); marker.openPopup(); };
                    listaDiv.appendChild(div);
                });
            });
    </script>
</body>
</html>

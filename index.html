<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Gestão de IGs - Amapá</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; }
        .menu-nav { background-color: #2e7d32; padding: 15px; display: flex; gap: 10px; justify-content: center; }
        .container { display: flex; height: calc(100vh - 60px); }
        
        #mapa-container { flex: 3; height: 100%; }
        #lista-comunidades { flex: 1; overflow-y: auto; background: #fff; padding: 15px; border-left: 2px solid #ddd; }
        
        .item-comunidade { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .item-comunidade:hover { background: #f0f0f0; }
        .coords { font-size: 0.8em; color: #666; display: none; }
        .item-comunidade:hover .coords { display: block; }
        
        .texto-pacui div { font-size: 20px; font-weight: 900; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; text-shadow: 2px 2px 4px #000; pointer-events: none; }
    </style>
</head>
<body>

    <nav class="menu-nav">
        <button onclick="window.location.reload()">Recarregar Mapa</button>
    </nav>

    <div class="container">
        <div id="mapa-container"></div>
        <div id="lista-comunidades">
            <h3>Comunidades</h3>
            <div id="lista-itens"></div>
        </div>
    </div>

    <script>
        var mapa = L.map('mapa-container').setView([0.75, -50.7], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

        var urlPlanilha = "SUA_URL_AQUI"; 
        
        fetch(urlPlanilha)
            .then(res => res.json())
            .then(dados => {
                // Desenha Polígono e Texto
                if (dados.poligono) {
                    var poly = L.polygon(dados.poligono.map(p => [p.lat, p.lng]), 
                    {color: "#b71c1c", weight: 3, fillColor: "#f44336", fillOpacity: 0.3}).addTo(mapa);
                    L.marker(poly.getBounds().getCenter(), {
                        icon: L.divIcon({className: 'texto-pacui', html: '<div>REGIÃO DO PACUÍ</div>', iconSize: [250, 40]})
                    }).addTo(mapa);
                }

                // Cria lista e pontos
                var listaDiv = document.getElementById('lista-itens');
                dados.comunidades.forEach(c => {
                    // Adiciona Ponto no Mapa
                    var marker = L.circleMarker([c.lat, c.lng], {radius: 6, fillColor: "#2e7d32", color: "#fff", weight: 2})
                                  .bindPopup(`<strong>${c.nome}</strong>`)
                                  .addTo(mapa);

                    // Adiciona na Lista Lateral
                    var div = document.createElement('div');
                    div.className = 'item-comunidade';
                    div.innerHTML = `<strong>${c.nome}</strong><br><span class="coords">Lat: ${c.lat}, Lng: ${c.lng}</span>`;
                    
                    div.onclick = function() {
                        mapa.setView([c.lat, c.lng], 14);
                        marker.openPopup();
                    };
                    
                    listaDiv.appendChild(div);
                });
            });
    </script>
</body>
</html>

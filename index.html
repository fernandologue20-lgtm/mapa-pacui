<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário Digital de Indicações Geográficas - Amapá</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <style> 
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; color: #333; }
        .hero { text-align: center; background: #1b5e20; color: white; padding: 40px 20px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        #mapa { height: 600px; width: 100%; border: 2px solid #ddd; border-radius: 8px; margin-top: 20px; }
        
        .label-estilo { 
            background: transparent !important; border: none !important; box-shadow: none !important; 
            font-size: 9px !important; font-weight: 800 !important; color: #1b5e20 !important;
            text-shadow: -1px -1px 0 #FFF, 1px -1px 0 #FFF, -1px 1px 0 #FFF, 1px 1px 0 #FFF !important;
        }
        .info-cartografica { background: rgba(255, 255, 255, 0.95); padding: 10px; border-radius: 5px; font-size: 11px; border-left: 4px solid #1565c0; }
        .mapa-situacao-img { border: 2px solid #fff; border-radius: 5px; width: 140px; cursor: pointer; }
    </style>
</head>
<body>

    <header class="hero"><h1>Inventário Digital de Indicações Geográficas - Amapá</h1></header>

    <div class="container">
        <section id="mapa-secao">
            <h2>Mapa Integrado de Rotas e Produtores</h2>
            <div id="mapa"></div>
        </section>
    </div>

    <script>
        var mapa = L.map('mapa').setView([0.75, -50.60], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

        // 1. CARREGAR COMUNIDADES DA PLANILHA
        var urlPlanilha = "SUA_URL_DO_SCRIPT_AQUI"; // <-- COLOQUE SUA URL AQUI
        
        fetch(urlPlanilha)
            .then(res => res.json())
            .then(dados => {
                dados.forEach(c => {
                    var lat = parseFloat(c.lat);
                    var lng = parseFloat(c.lng);
                    if (!isNaN(lat) && !isNaN(lng)) {
                        L.circleMarker([lat, lng], {radius: 4, fillColor: "#2e7d32", color: "#fff", weight: 1, fillOpacity: 0.9})
                         .bindTooltip(c.nome, {permanent: true, direction: 'top', className: 'label-estilo', offset: [0, -5]})
                         .addTo(mapa);
                    }
                });
            });

        // 2. POLÍGONO DO TERRITÓRIO
        var coordenadas = [ /* ... suas coordenadas ... */ ];
        L.polygon(coordenadas.map(c => [c[1], c[0]]), {
            color: "#b71c1c", weight: 3, fillColor: "#f44336", fillOpacity: 0.15
        }).addTo(mapa);

        // 3. Mini-Mapa e Legenda
        var miniMapa = L.control({ position: 'bottomleft' });
        miniMapa.onAdd = function() {
            var img = L.DomUtil.create('img', 'mapa-situacao-img');
            img.src = 'Screenshot_20260605_215242_Chrome.jpg';
            return img;
        };
        miniMapa.addTo(mapa);

        var info = L.control({ position: 'bottomright' });
        info.onAdd = function() {
            var div = L.DomUtil.create('div', 'info-cartografica');
            div.innerHTML = "<h4>Dados IBGE</h4>Distrito: 24 - São Joaquim do Pacuí";
            return div;
        };
        info.addTo(mapa);

        // Segurança
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))) e.preventDefault();
        });
    </script>
</body>
</html>

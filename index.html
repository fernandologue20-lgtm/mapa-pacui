<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Inventário Digital de IGs - Amapá</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #mapa { height: 600px; width: 100%; }
        .label-estilo { background: transparent; border: none; font-size: 10px; font-weight: bold; color: #1b5e20; }
    </style>
</head>
<body>

    <div id="mapa"></div>

    <script>
        // Inicializa o mapa
        var mapa = L.map('mapa').setView([0.75, -50.7], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

        // Busca os dados do seu Google Apps Script
        fetch("https://script.google.com/macros/s/AKfycbgrHOhYywlHq_-8wULBkykeTmP8U01KzfdFwij4zxNoz_gajxwEnadhz_OuPBtndg/exec")
            .then(res => res.json())
            .then(dados => {
                // 1. Desenha o Polígono
                var coordsPol = dados.poligono.map(p => [p.lat, p.lng]);
                L.polygon(coordsPol, {color: "#b71c1c", weight: 3}).addTo(mapa);

                // 2. Desenha a Rota
                var coordsRota = dados.rota.map(r => [r.lat, r.lng]);
                L.polyline(coordsRota, {color: '#ff9800', weight: 4, dashArray: '10, 10'}).addTo(mapa);

                // 3. Adiciona as Comunidades
                dados.comunidades.forEach(c => {
                    L.circleMarker([c.lat, c.lng], {radius: 5, fillColor: "#2e7d32", color: "#fff"})
                     .bindTooltip(c.nome, {permanent: true, className: 'label-estilo'})
                     .addTo(mapa);
                });
            })
            .catch(err => console.error("Erro ao carregar dados:", err));
    </script>
</body>
</html>

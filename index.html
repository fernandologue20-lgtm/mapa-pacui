<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário Digital de Indicações Geográficas - Amapá</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; scroll-behavior: smooth; }
        .hero { text-align: center; background: #1b5e20; color: white; padding: 50px 20px; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        section { background: white; padding: 30px; margin-bottom: 20px; border-radius: 8px; }
        #mapa { height: 500px; width: 100%; border: 2px solid #ddd; border-radius: 8px; }
        .label-estilo { background: rgba(255,255,255,0.9); border: 1px solid #2e7d32; font-size: 10px; font-weight: bold; color: #1b5e20; padding: 2px 5px; border-radius: 4px; }
        .mapa-situacao-img { border: 2px solid #fff; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.4); width: 140px; cursor: pointer; }
        #lightboxZoom { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        #imgZoomExpandida { max-width: 90%; max-height: 90%; border: 4px solid white; border-radius: 8px; }
        .info-cartografica { background: rgba(255, 255, 255, 0.95); padding: 10px; border-radius: 5px; font-size: 11px; border-left: 4px solid #1565c0; }
        .chatbot-btn { position: fixed; bottom: 20px; right: 20px; z-index: 4000; background: #1565c0; color: white; border: none; border-radius: 50px; padding: 15px 25px; cursor: pointer; font-weight: bold; }
        .chatbot-window { display: none; position: fixed; bottom: 80px; right: 20px; width: 350px; height: 450px; background: white; z-index: 4000; box-shadow: 0 0 10px rgba(0,0,0,0.3); flex-direction: column; border-radius: 10px; overflow: hidden; }
        .chat-body { flex:1; overflow-y:auto; padding:10px; background: #f4f7f6; }
        .chat-footer { padding: 10px; display: flex; gap: 5px; }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Inventário Digital de Indicações Geográficas - Amapá</h1>
    </header>

    <div class="container">
        <section id="mapa-secao">
            <h2>Mapa Integrado</h2>
            <div id="mapa"></div>
        </section>
        
        </div>

    <div id="lightboxZoom" onclick="this.style.display='none'">
        <img id="imgZoomExpandida" src="">
    </div>

    <button class="chatbot-btn" onclick="document.getElementById('chatbotWindow').style.display='flex'">🤖 Assistente IG</button>
    <div class="chatbot-window" id="chatbotWindow">
        <div style="background:#1565c0; color:white; padding:10px;">Assistente IA <span onclick="this.parentElement.parentElement.style.display='none'" style="float:right; cursor:pointer;">×</span></div>
        <div id="chatBody" class="chat-body"></div>
        <div class="chat-footer"><input id="chatInput" style="flex:1"><button onclick="enviarMensagemGemini()">Enviar</button></div>
    </div>

    <script>
        // Inicialização do Mapa
        var mapa = L.map('mapa', { center: [0.35, -51.05], zoom: 9 });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

        // Imagem Situação
        var miniMapa = L.control({ position: 'bottomleft' });
        miniMapa.onAdd = function() {
            var img = L.DomUtil.create('img', 'mapa-situacao-img');
            img.src = 'Screenshot_20260605_215242_Chrome.jpg';
            img.onclick = function() { document.getElementById('imgZoomExpandida').src = img.src; document.getElementById('lightboxZoom').style.display = 'flex'; };
            return img;
        };
        miniMapa.addTo(mapa);

        // Painel Técnico
        var info = L.control({ position: 'bottomright' });
        info.onAdd = function() {
            var div = L.DomUtil.create('div', 'info-cartografica');
            div.innerHTML = "<h4>Dados IBGE</h4>Distrito: 24 - São Joaquim do Pacuí<br>Código: 160030324<br>Sede: Lat 0.04 | Lng -51.05<br>Datum: SIRGAS 2000";
            return div;
        };
        info.addTo(mapa);

        // Sede e Comunidades
        L.marker([0.04, -51.05]).addTo(mapa).bindPopup("<b>Sede: São Joaquim do Pacuí</b>");

        var comunidades = [
            {nome: "Corre Água do Piririm", lat: 0.1, lng: -51.06}, {nome: "Aterro do Gurijuba", lat: 0.12, lng: -51.07},
            {nome: "Boa Vista", lat: 0.14, lng: -51.08}, {nome: "Campina de São Benedito", lat: 0.16, lng: -51.09},
            {nome: "Cantazal", lat: 0.18, lng: -51.10}, {nome: "Damasio", lat: 0.20, lng: -51.11},
            {nome: "Dois Irmãos", lat: 0.22, lng: -51.12}, {nome: "Garimpo de São Tome", lat: 0.24, lng: -51.13},
            {nome: "Ilha Jupari", lat: 0.26, lng: -51.14}, {nome: "Lago do Papagaio", lat: 0.28, lng: -51.15},
            {nome: "Liberdade", lat: 0.30, lng: -51.16}, {nome: "Palestina", lat: 0.32, lng: -51.17},
            {nome: "Ponta Grosa", lat: 0.34, lng: -51.18}, {nome: "Puraquê", lat: 0.36, lng: -51.19},
            {nome: "Ramal Armentino", lat: 0.38, lng: -51.20}, {nome: "Ramal do Darci", lat: 0.40, lng: -51.21},
            {nome: "Ramal do Satiro", lat: 0.42, lng: -51.22}, {nome: "Salamito", lat: 0.44, lng: -51.23},
            {nome: "Santa Cruz", lat: 0.46, lng: -51.24}, {nome: "Santa Luzia do Pacui", lat: 0.48, lng: -51.25},
            {nome: "São Benedito", lat: 0.50, lng: -51.26}, {nome: "São Francisco", lat: 0.52, lng: -51.27},
            {nome: "São Joaquim do Pacuí", lat: 0.54, lng: -51.28}, {nome: "São Raimundo", lat: 0.56, lng: -51.29},
            {nome: "São Sebastião", lat: 0.58, lng: -51.30}, {nome: "São Tomé do Pacuí", lat: 0.60, lng: -51.31},
            {nome: "Serraria", lat: 0.62, lng: -51.32}, {nome: "Tracajatuba I", lat: 0.64, lng: -51.33},
            {nome: "Tracajatuba II", lat: 0.66, lng: -51.34}, {nome: "Vai Quem Quer", lat: 0.68, lng: -51.35},
            {nome: "Vila do Ananazal", lat: 0.70, lng: -51.36}, {nome: "Vila do Miguel", lat: 0.72, lng: -51.37},
            {nome: "Vila Gordo", lat: 0.74, lng: -51.38}, {nome: "Vila Jupati", lat: 0.76, lng: -51.39}
        ];

        comunidades.forEach(c => {
            L.circleMarker([c.lat, c.lng], {radius: 5, fillColor: "#2e7d32", color: "#fff", weight: 1, fillOpacity: 0.9})
             .bindTooltip(c.nome, {className: 'label-estilo'})
             .addTo(mapa);
        });

        // IA c/ Retry
        async function enviarMensagemGemini() {
            var msg = document.getElementById('chatInput').value.trim();
            if(!msg) return;
            var body = document.getElementById('chatBody');
            body.innerHTML += `<div style='text-align:right; margin:5px;'>Você: ${msg}</div>`;
            document.getElementById('chatInput').value = '';
            
            let key = localStorage.getItem("GEMINI_API_KEY") || prompt("Chave API:");
            if(key) localStorage.setItem("GEMINI_API_KEY", key);

            let tentativas = 0;
            while(tentativas < 3) {
                try {
                    let res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + key, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({contents: [{role: "user", parts: [{text: msg}]}]})
                    });
                    if(res.ok) {
                        let data = await res.json();
                        body.innerHTML += `<div style='background:white; padding:5px; margin:5px;'>IA: ${data.candidates[0].content.parts[0].text}</div>`;
                        return;
                    }
                    if(res.status === 503) throw new Error("HighDemand");
                } catch(e) {
                    tentativas++;
                    if(tentativas >= 3) body.innerHTML += `<div style='color:red;'>Erro: Tente novamente mais tarde.</div>`;
                    else await new Promise(r => setTimeout(r, 2000));
                }
            }
        }
    </script>
</body>
</html>

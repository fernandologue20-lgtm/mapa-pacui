<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Inventário Digital de IGs - Amapá</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Define que o mapa vai ocupar a tela toda */
        #mapa { height: 600px; width: 100%; }
        .label-estilo { background: transparent; border: none; font-size: 10px; font-weight: bold; color: #1b5e20; }
    </style>
</head>
<body>

    <div id="mapa"></div>

    <script>
        // 1. Cria o mapa
        var mapa = L.map('mapa').setView([0.75, -50.7], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

        // 2. Busca os dados da sua planilha
        var url = "https://script.google.com/macros/s/AKfycbygrHOhYywIbHq_-8wULBkykeTmP8U01KzfdFwij4zxNozs_gajxnwEnadhz_OuPBtNdg/exec";
        
        fetch(url)
            .then(res => res.json())
            .then(dados => {
                // Desenha o polígono
                if (dados.poligono) {
                    L.polygon(dados.poligono.map(p => [p.lat, p.lng]), {color: "red"}).addTo(mapa);
                }
                // Desenha a rota
                if (dados.rota) {
                    L.polyline(dados.rota.map(r => [r.lat, r.lng]), {color: 'orange'}).addTo(mapa);
                }
                // Desenha os pontos das comunidades
                if (dados.comunidades) {
                    dados.comunidades.forEach(c => {
                        L.circleMarker([c.lat, c.lng], {radius: 5, fillColor: "green", color: "white"})
                         .bindTooltip(c.nome, {permanent: true, className: 'label-estilo'})
                         .addTo(mapa);
                    });
                }
            });
    </script>
</body>
</html>
